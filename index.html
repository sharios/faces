<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Face Builder</title>
  <meta name="description" content="Build a cartoon face by mixing hair, eyes, nose and mouth." />
  <meta name="theme-color" content="#f7f4ee" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <h1 class="brand">Face&nbsp;Builder</h1>
    <div class="topbar-actions">
      <button id="btn-random" class="btn" type="button" title="Randomize">🎲 <span>Random</span></button>
      <button id="btn-reset" class="btn" type="button" title="Reset">↺ <span>Reset</span></button>
      <button id="btn-download" class="btn btn-primary" type="button" title="Download PNG">⭳ <span>Download</span></button>
      <button id="btn-install" class="btn" type="button" hidden>⤓ <span>Install</span></button>
    </div>
  </header>

  <main class="layout">
    <section class="stage-wrap" aria-label="Face preview">
      <div id="stage" class="stage"></div>
    </section>

    <section class="picker" aria-label="Feature picker">
      <div id="tabs" class="tabs" role="tablist"></div>
      <div id="options" class="options" role="tabpanel"></div>
    </section>
  </main>

  <div id="toast" class="toast" hidden></div>

  <script src="js/app.js"></script>
</body>
</html>
